name: emon_core
description: Dart API over the emon C library (PDF and image to semantic HTML/JSON), with engine adapters, model packs and build hooks.
version: 0.0.0-dev
repository: https://github.com/3sln/emon
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  archive: ^4.0.0
  code_assets: ^2.2.0
  crypto: ^3.0.6
  ffi: ^2.1.0
  hooks: ^2.2.0
  path: ^1.9.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.25.0

# Development in this repository: the archives `bb package --host c` (desktop) and `bb mobile --triple T` write to dist/c. A consumer's own pubspec decides
# for its build (hooks: user_defines: emon_core: native_dir: ...); these lines are the package's own, used by `dart test` here.
hooks:
  user_defines:
    emon_core:
      native_dir: ../../../dist/c
