# The manifest of the `emon` command (P11.4b, D541). Like the Rust host's, the crate is ASSEMBLED, not built here: `EMON_CLI=1
# EMON_NATIVE=<.cache/native/TRIPLE> kin/scripts/emon-rs-build` puts gen/rust/emon/*.rs, host/rust/src/*.rs, host/cli/src/main.rs and
# THIRD_PARTY_NOTICES.md under .cache/emon-cli/ with this file, and `bb cli` runs it. The package is the library `emon` plus the binary `emon`;
# its version is version.edn's (`bb version` rewrites the line below, `bb version --check` holds it).
[package]
name = "emon"
version = "0.0.0-dev"
license = "MIT"
edition = "2021"
description = "emon: documents (PDF, images) to semantic HTML and a JSON Model; the command-line tool"

[lib]
path = "src/lib.rs"

[[bin]]
name = "emon"
path = "src/main.rs"

[features]
tesseract = []
# Apple Vision (host/rust/src/vision.rs, K8, D901), macOS only: the CLI links the shim of host/vision (tools/native/vision.clj) and registers the port beside Tesseract's
vision = []
# Windows.Media.Ocr (host/rust/src/winocr.rs, K8), Windows only: the CLI of a Windows machine registers the port beside Tesseract's
winocr = ["dep:windows"]

[dependencies]
# the same pins as the Rust host (kin/scripts/emon-rs-build); the lock file is host/rust/Cargo.lock
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "=0.8.9"
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"

# Windows.Media.Ocr (host/rust/src/winocr.rs, K8): the system's own WinRT API through the `windows` crate, on Windows only and only with the feature
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, default-features = false, features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "System_Profile", "Win32_System_WinRT"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pdfium)", "cfg(pdfium_dl)", "cfg(codecs)", "cfg(ppocr)"] }

[profile.release]
opt-level = 3
overflow-checks = true
debug = false
strip = true
