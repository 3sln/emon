# The manifest of the `emon` command (P11.4b, D1470). Like the Rust host's, the crate is ASSEMBLED, not built here: `EMON_CLI=1
# EMON_NATIVE=<.cache/native/TRIPLE> kin/scripts/emon-rs-build` puts gen/rust/emon/*.rs, host/rust/src/*.rs, host/cli/src/main.rs and
# THIRD_PARTY_NOTICES.md under .cache/emon-cli/ with this file, and `bb cli` runs it. The package is the library `emon` plus the binary `emon`;
# its version is version.edn's (`bb version` rewrites the line below, `bb version --check` holds it).
[package]
name = "emon"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "emon: documents (PDF, images) to semantic HTML and a JSON Model; the command-line tool"

[lib]
path = "src/lib.rs"

[[bin]]
name = "emon"
path = "src/main.rs"

[features]
tesseract = []

[dependencies]
# the same pins as the Rust host (kin/scripts/emon-rs-build); the lock file is host/rust/Cargo.lock
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "=0.8.9"
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pdfium)", "cfg(pdfium_dl)", "cfg(codecs)"] }

[profile.release]
opt-level = 3
overflow-checks = true
debug = false
strip = true
