# PUBLISH A RELEASE (P11.10, D524, D542, D547, D550). Starts ONLY when the maintainer publishes the DRAFT release (`release: published`; GitHub makes the tag vX.Y.Z at the
# commit the draft targets, which draft.yml set to a full sha). A manual run (workflow_dispatch) is ALWAYS a dry run: it verifies and checks every credential and every
# registry's "already published?" answer, and publishes nothing (no job below passes anything but --dry-run on that path; pages is skipped, nothing is attached).
#
#   verify  bb release-verify: `bb version --check TAG` on the tagged tree, the tag still points at the commit that is checked out, the release still targets that commit (it
#           was not retargeted after draft.yml), and the commit status `emon/verified` there is green (verify.yml's). Nothing is published unless this passes. It outputs the
#           verified COMMIT, and every job below checks out THAT commit, not the tag name, so a tag moved afterwards changes nothing.
#   assets  the release archives (CLI x5, C x4, pod x4, SHA256SUMS): downloaded from the verify.yml run that `emon/archives` records for that commit, or for its nearest
#           verified ancestor whose archives are still valid (same version, inside the artifact retention), and attached to the release. Same approval as the registries.
#   crates npm nuget maven go   one job each, independent (one failing does not stop or undo the others), each in the `release` environment (required reviewer; the
#           registry secrets live there), each = `bb package --host H` then `bb publish H`: it SKIPS a version the registry already has, so a re-run publishes only
#           what is missing. All use GITHUB_TOKEN plus the registry's own secret; no other credential exists.
#   pages   the demo, by calling pages.yml with the verified commit (after the same approval).
#   summary one report of what happened, and the failing exit code if any registry did not succeed: a partial publish is named, not silent.
#
# Needs (docs/releasing.md has the order): the environment `release` with @raystubbs as required reviewer; these secrets (repository level is fine, a job in the environment
# inherits them): CARGO_REGISTRY_TOKEN, NPM_TOKEN, MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY, and optionally MAVEN_GPG_PASSPHRASE; for NuGet no secret:
# a Trusted Publishing policy on nuget.org (owner 3sln, repo emon, workflow publish.yml, environment release) and the organization variable NUGET_USER (NuGet/login mints a
# short-lived key per publish); Settings > Pages > Source = GitHub Actions.
# Never run: needs the credentials, a draft release and Actions credits (D524).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "DRY RUN of this tag (vX.Y.Z); publishes nothing"
        type: string
        required: true
      ref:
        description: "DRY RUN: the commit to check out (default main); a tag that does not exist yet is reported, not failed"
        type: string
        default: main

permissions:
  contents: read

# one publication per tag; a running one is finished, never cancelled (a registry may be mid-upload)
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: emon

env:
  CI: "true"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # a release event publishes; anything else (workflow_dispatch) is a dry run
  DRY_FLAG: ${{ github.event_name == 'release' && ' ' || '--dry-run' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || inputs.ref }}
          path: emon
          fetch-depth: 0
          fetch-tags: true
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - id: verify
        name: bb release-verify (version, tag, the release's target, emon/verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bb release-verify --tag "$TAG" ${DRY_FLAG}

  assets:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # uploads to the release
      actions: read # downloads the artifact of the verify.yml run
    outputs:
      outcome: ${{ steps.attach.outputs.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ needs.verify.outputs.sha || github.sha }}
          path: emon
          fetch-depth: 0
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: Find the archives of this commit (or of its nearest verified ancestor with valid ones) and download them
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify.outputs.sha || github.sha }}
        run: bb release-ops fetch-archives --sha "$SHA" --version "${TAG#v}" --out "$RUNNER_TEMP/archives" ${DRY_FLAG}
      - id: attach
        name: Attach them, with SHA256SUMS, to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bb release-ops attach --tag "$TAG" --dir "$RUNNER_TEMP/archives"
          echo "outcome=attached" >> "$GITHUB_OUTPUT"

  crates:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ needs.verify.outputs.sha || github.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: Rust 1.92.0 (the version of every gate)
        run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - name: bb package --host rust (cargo package --locked, verified build included)
        run: bb package --host rust
      - id: publish
        name: bb publish crates
        run: bb publish crates ${DRY_FLAG}

  npm:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # npm provenance (an attestation that this workflow built the tarball)
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ needs.verify.outputs.sha || github.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: Rust 1.92.0 and the pinned nightly for emon.wasm (the unwinding std)
        run: |
          rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
          rustup toolchain install nightly-2026-09-16 -c rust-src -t wasm32-unknown-unknown
      # D551, D553: this job also builds @3sln/pdfium-wasm (from the pinned pdfium wasm build), so the native pins and pdfium are fetched first, and a missing
      # cache FAILS the package step (EMON_PACKAGE_REQUIRE_NATIVE) instead of silently leaving a package out. The prefix cache is native.yml's (D540).
      - name: Cache key (the pins)
        id: pins
        run: echo "hash=$(bb native --pin-hash)" >> "$GITHUB_OUTPUT"
      - name: Source tarballs (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/dl
          key: native-dl-${{ hashFiles('emon/tools/native/native.edn') }}
      - name: Static Tesseract and Leptonica (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/x86_64-unknown-linux-gnu
          key: native-prefix-x86_64-unknown-linux-gnu-ubuntu-24.04-${{ steps.pins.outputs.hash }}
      - name: NASM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: bb native (a cache hit is only audited)
        run: bb native --jobs 4
      - name: The pinned pdfium for this platform, and its WebAssembly build
        run: |
          bb pdfium-fetch
          bb pdfium-fetch --platform wasm
      - name: bb package --host js (emon.wasm, npm pack of @3sln/emon and of @3sln/pdfium-wasm)
        env:
          EMON_PACKAGE_REQUIRE_NATIVE: "1"
        run: bb package --host js
      - id: publish
        name: bb publish npm
        run: bb publish npm ${DRY_FLAG}

  nuget:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # nuget.org Trusted Publishing (NuGet/login exchanges the OIDC token for a short-lived API key)
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ needs.verify.outputs.sha || github.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: bb package --host csharp (dotnet pack)
        run: bb package --host csharp
      # real publishes only: a dry run (workflow_dispatch) mints no key and `bb publish nuget --dry-run` needs none
      - id: nuget-login
        name: NuGet Trusted Publishing (a short-lived API key)
        if: github.event_name == 'release'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - id: publish
        name: bb publish nuget
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bb publish nuget ${DRY_FLAG}

  maven:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 90 # the Central Portal validates a bundle for up to ~40 minutes
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ needs.verify.outputs.sha || github.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: bb package --host java (jar, sources, javadoc, pom, unsigned bundle)
        run: |
          export EMON_JDK="$JAVA_HOME"
          bb package --host java
      - id: publish
        name: bb publish maven (signs with MAVEN_GPG_PRIVATE_KEY, uploads to the Central Portal, waits)
        run: bb publish maven ${DRY_FLAG}

  go:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes the tag go/vX.Y.Z (a tag only: no branch is touched)
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ needs.verify.outputs.sha || github.sha }}
          path: emon
          fetch-depth: 0
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.21.13
          cache: false
      - name: bb package --host go (the assembled module tree, go build and go vet)
        run: bb package --host go
      - id: publish
        name: bb publish go (a tag-only commit holding go/, and the tag go/vX.Y.Z)
        run: bb publish go ${DRY_FLAG}

  # the demo waits for the same approval as the registries (the reusable workflow cannot name an environment itself)
  approve:
    if: github.event_name == 'release'
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "approved in the release environment"
        working-directory: .

  pages:
    needs: [verify, approve]
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write

  summary:
    if: always()
    needs: [verify, assets, crates, npm, nuget, maven, go, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ needs.verify.outputs.sha || github.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: The report (fails if any registry did not succeed)
        env:
          RESULTS: >-
            verify=${{ needs.verify.result }},assets=${{ needs.assets.result }}:${{ needs.assets.outputs.outcome }},crates=${{ needs.crates.result }}:${{ needs.crates.outputs.outcome }},npm=${{ needs.npm.result }}:${{ needs.npm.outputs.outcome }},nuget=${{ needs.nuget.result }}:${{ needs.nuget.outputs.outcome }},maven=${{ needs.maven.result }}:${{ needs.maven.outputs.outcome }},go=${{ needs.go.result }}:${{ needs.go.outputs.outcome }},pages=${{ needs.pages.result }}
        run: bb release-ops summary --tag "$TAG" --results "$RESULTS" ${DRY_FLAG}
