# Every gate, in parallel, on demand (SPEC 15.3, D266). Manual only: no push or pull_request trigger.
#   gh workflow run gates.yml -f groups=all [-f ref=main]
# Needs the repository secrets listed in SPEC 15.3 (the corpus bucket). All scripting is babashka.
name: gates

on:
  workflow_dispatch:
    inputs:
      groups:
        description: Which groups to run
        type: choice
        options: [all, unit-only, fast-only]
        default: all
      ref:
        description: emon ref to test (branch, tag or sha)
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: gates-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: emon

env:
  CI: "true"

jobs:
  # ---- the corpus: pulled only when the remote index.json changes -------------------------------------------------
  # png-check and image read corpus/ (the unit arms pull their own, larger share). Only the
  # categories they read are pulled (formats, financial), which keeps the cache under GitHub's 10 GB limit.
  corpus:
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.sha.outputs.index }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref }}
          path: emon
      - uses: actions/checkout@v4
        with:
          repository: 3sln/kin
          path: kin
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.3.190
      - name: Corpus credentials (.env from repository secrets)
        env:
          EMON_S3_ENDPOINT: ${{ secrets.EMON_S3_ENDPOINT }}
          EMON_S3_REGION: ${{ secrets.EMON_S3_REGION }}
          EMON_S3_BUCKET: ${{ secrets.EMON_S3_BUCKET }}
          EMON_S3_PREFIX: ${{ secrets.EMON_S3_PREFIX }}
          EMON_S3_ACCESS_KEY_ID: ${{ secrets.EMON_S3_ACCESS_KEY_ID }}
          EMON_S3_SECRET_ACCESS_KEY: ${{ secrets.EMON_S3_SECRET_ACCESS_KEY }}
          EMON_S3_PATH_STYLE: ${{ secrets.EMON_S3_PATH_STYLE }}
        run: |
          missing=""
          for k in EMON_S3_ENDPOINT EMON_S3_REGION EMON_S3_BUCKET EMON_S3_ACCESS_KEY_ID EMON_S3_SECRET_ACCESS_KEY; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::the corpus gates need these repository secrets, and they are not set:$missing (Settings > Secrets and variables > Actions; SPEC 15.3). "
            exit 1
          fi
          for k in EMON_S3_ENDPOINT EMON_S3_REGION EMON_S3_BUCKET EMON_S3_PREFIX EMON_S3_ACCESS_KEY_ID EMON_S3_SECRET_ACCESS_KEY EMON_S3_PATH_STYLE; do
            [ -z "${!k}" ] || printf '%s=%s\n' "$k" "${!k}"
          done > .env
      - name: Remote index sha
        id: sha
        run: echo "index=$(bb corpus-index-sha)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: emon/corpus
          key: emon-corpus-${{ steps.sha.outputs.index }}
      - name: Pull the corpus (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bb corpus-pull formats financial
      - name: Remove credentials
        if: always()
        run: rm -f .env

  # ---- the laws, one arm per job (bb unit ARM), then the cross-arm count in the summary ----------------------------
  unit:
    if: inputs.groups != 'fast-only'
    name: unit (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm: [go, rust, java, csharp]
    steps:
      - name: Free disk (the corpus categories below are about 9 GB)
        working-directory: .
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref }}
          path: emon
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 3sln/kin
          path: kin
      - uses: ./emon/.github/actions/setup
      - name: Corpus for the real-file laws (formats financial forms layout multilingual tables; too big to cache)
        env:
          EMON_S3_ENDPOINT: ${{ secrets.EMON_S3_ENDPOINT }}
          EMON_S3_REGION: ${{ secrets.EMON_S3_REGION }}
          EMON_S3_BUCKET: ${{ secrets.EMON_S3_BUCKET }}
          EMON_S3_PREFIX: ${{ secrets.EMON_S3_PREFIX }}
          EMON_S3_ACCESS_KEY_ID: ${{ secrets.EMON_S3_ACCESS_KEY_ID }}
          EMON_S3_SECRET_ACCESS_KEY: ${{ secrets.EMON_S3_SECRET_ACCESS_KEY }}
          EMON_S3_PATH_STYLE: ${{ secrets.EMON_S3_PATH_STYLE }}
        run: |
          for k in EMON_S3_ENDPOINT EMON_S3_REGION EMON_S3_BUCKET EMON_S3_PREFIX EMON_S3_ACCESS_KEY_ID EMON_S3_SECRET_ACCESS_KEY EMON_S3_PATH_STYLE; do
            [ -z "${!k}" ] || printf "%s=%s\n" "$k" "${!k}"
          done > .env
          bb corpus-pull formats financial forms layout multilingual tables; rm -f .env; df -h . | tail -1
      - name: bb unit ${{ matrix.arm }}
        run: |
          set -o pipefail
          bb unit ${{ matrix.arm }} 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Record the law count
        run: bb ci laws-record ${{ matrix.arm }} "$RUNNER_TEMP/unit.log" "$RUNNER_TEMP/laws"
      - uses: actions/upload-artifact@v4
        with:
          name: laws-${{ matrix.arm }}
          path: ${{ runner.temp }}/laws/laws-${{ matrix.arm }}.txt

  # ---- the negative check: every law inverted, the arm must fail ---------------------------------------------------
  unit-red:
    if: inputs.groups != 'fast-only'
    name: unit red (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm: [go, rust, java, csharp]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref }}
          path: emon
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 3sln/kin
          path: kin
      - uses: ./emon/.github/actions/setup
      - name: bb unit red ${{ matrix.arm }}
        run: bb unit red ${{ matrix.arm }}

  # ---- the other gates, sharded; each shard is `bb gates G...` (exit 0, a score, no FAIL) --------------------------
  gates:
    if: inputs.groups != 'unit-only' && needs.corpus.result == 'success'
    needs: [corpus]
    name: gates (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: static, gates: "hosts drift lang-test", corpus: false}
          - {name: check, gates: "check", corpus: false}
          - {name: replay, gates: "plan ocr render embedders", corpus: false}
          - {name: fusion, gates: "align fusion artifacts seals retarget", corpus: false}
          - {name: slice, gates: "slice", corpus: false}
          - {name: fuzz, gates: "fuzz", corpus: false}
          - {name: identity, gates: "identity", corpus: false}
          - {name: repeat, gates: "repeat", corpus: false}
          - {name: accuracy, gates: "accuracy", corpus: false}
          - {name: png-check, gates: "png-check", corpus: true}
          - {name: asset, gates: "asset", corpus: false}
          - {name: image, gates: "image", corpus: true}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref }}
          path: emon
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 3sln/kin
          path: kin
      - uses: ./emon/.github/actions/setup
      - name: Corpus (png-check and image read real scans)
        if: matrix.corpus
        uses: actions/cache/restore@v4
        with:
          path: emon/corpus
          key: emon-corpus-${{ needs.corpus.outputs.index }}
          fail-on-cache-miss: true
      - name: Gate coverage of this workflow
        if: matrix.name == 'static'
        run: bb ci coverage
      - name: bb gates ${{ matrix.gates }}
        run: bb gates ${{ matrix.gates }}

  # ---- one verdict ---------------------------------------------------------------------------------------------------
  summary:
    if: always()
    needs: [corpus, unit, unit-red, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref }}
          path: emon
      - uses: actions/checkout@v4
        with:
          repository: 3sln/kin
          path: kin
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.3.190
      - uses: actions/download-artifact@v4
        if: needs.unit.result == 'success'
        with:
          pattern: laws-*
          path: ${{ runner.temp }}/laws
      - name: Every arm ran the same number of laws
        if: needs.unit.result == 'success'
        run: bb ci laws-compare "$RUNNER_TEMP/laws"
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "groups=${{ inputs.groups }} ref=${{ inputs.ref }}"
          echo "corpus=${{ needs.corpus.result }} unit=${{ needs.unit.result }} unit-red=${{ needs.unit-red.result }} gates=${{ needs.gates.result }}"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended $r"; exit 1 ;; esac
          done
          echo "  ok   every selected group passed"
