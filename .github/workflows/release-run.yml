# D886: per-version serialized pipeline. Called only after release.yml validates the ref/version.
name: release pipeline
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      only:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: emon
env:
  CI: 'true'
  TAG: v${{ inputs.version }}
  DRY_FLAG: ${{ inputs.dry_run && '--dry-run' || ' ' }}
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      sha: ${{ inputs.sha }}
      mode: full
    secrets: inherit
    permissions:
      contents: read
      statuses: write

  assets:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      statuses: read
    outputs:
      outcome: ${{ steps.release.outputs.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          path: emon
          fetch-depth: 0
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: Download and validate verified archives before creating anything public
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: bb release-ops fetch-archives --sha "$SHA" --version "${TAG#v}" --out "$RUNNER_TEMP/archives"
      - id: release
        name: Reuse or create the tag and published release with notes and archives
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          ONLY: ${{ inputs.only }}
        run: |
          bb release-notes --until "$SHA" --version "${TAG#v}" --out "$RUNNER_TEMP/notes.md"
          bb release-ops release --tag "$TAG" --sha "$SHA" --notes "$RUNNER_TEMP/notes.md" --dir "$RUNNER_TEMP/archives" --only "$ONLY" ${DRY_FLAG}
  crates:
    needs: assets
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',crates,')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: Rust 1.92.0 (the version of every gate)
        run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - name: bb package --host rust (cargo package --locked, verified build included)
        run: bb package --host rust
      - id: publish
        name: bb publish crates
        run: bb publish crates ${DRY_FLAG}

  npm:
    needs: assets
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',npm,')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC, no stored token) and provenance
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: Rust 1.92.0 and the pinned nightly for emon.wasm (the unwinding std)
        run: |
          rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
          rustup toolchain install nightly-2026-09-16 -c rust-src -t wasm32-unknown-unknown
      # D551, D553: this job also builds @3sln/pdfium-wasm (from the pinned pdfium wasm build), so the native pins and pdfium are fetched first, and a missing
      # cache FAILS the package step (EMON_PACKAGE_REQUIRE_NATIVE) instead of silently leaving a package out. The prefix cache is native.yml's (D540).
      - name: Cache key (the pins)
        id: pins
        run: echo "hash=$(bb native --pin-hash)" >> "$GITHUB_OUTPUT"
      - name: Source tarballs (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/dl
          key: native-dl-${{ hashFiles('emon/tools/native/native.edn') }}
      - name: Static Tesseract and Leptonica (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/x86_64-unknown-linux-gnu
          key: native-prefix-x86_64-unknown-linux-gnu-ubuntu-24.04-${{ steps.pins.outputs.hash }}
      - name: NASM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: bb native (a cache hit is only audited)
        run: bb native --jobs 4
      - name: The pinned pdfium for this platform, and its WebAssembly build
        run: |
          bb pdfium-fetch
          bb pdfium-fetch --platform wasm
      - name: Package the SDK, pdfium and separate experimental PP npm package
        env:
          EMON_PACKAGE_REQUIRE_NATIVE: "1"
        run: bb package --host js --host js-ppocr
      # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1; the runner's default npm is older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm 11.21.2 (Trusted Publishing)
        run: npm install -g npm@11.21.2 && npm --version
      - id: publish
        name: bb publish npm
        run: bb publish npm ${DRY_FLAG}

  nuget:
    needs: assets
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',nuget,')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # nuget.org Trusted Publishing (NuGet/login exchanges the OIDC token for a short-lived API key)
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    steps:
      - name: Check NuGet profile variable
        working-directory: .
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER//[[:space:]]/}" ]]; then
            echo "::error::NUGET_USER is empty. Grant the organization Actions variable repository access to emon, or create a repository Actions variable NUGET_USER containing your nuget.org profile name."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: bb package --host csharp (dotnet pack)
        run: bb package --host csharp
      # real publishes only: a dry run (workflow_dispatch) mints no key and `bb publish nuget --dry-run` needs none
      - id: nuget-login
        name: NuGet Trusted Publishing (a short-lived API key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - id: publish
        name: bb publish nuget
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bb publish nuget ${DRY_FLAG}

  maven:
    needs: assets
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',maven,')
    runs-on: ubuntu-latest
    timeout-minutes: 90 # the Central Portal validates a bundle for up to ~40 minutes
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: bb package --host java (jar, sources, javadoc, pom, unsigned bundle)
        run: |
          export EMON_JDK="$JAVA_HOME"
          bb package --host java
      - id: publish
        name: bb publish maven (signs with MAVEN_GPG_PRIVATE_KEY, uploads to the Central Portal, waits)
        run: bb publish maven ${DRY_FLAG}

  go:
    needs: assets
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',go,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes the tag go/vX.Y.Z (a tag only: no branch is touched)
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.sha }}
          path: emon
          fetch-depth: 0
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.21.13
          cache: false
      - name: bb package --host go (the assembled module tree, go build and go vet)
        run: bb package --host go
      - id: publish
        name: bb publish go (a tag-only commit holding go/, and the tag go/vX.Y.Z)
        run: bb publish go ${DRY_FLAG}

  summary:
    if: always()
    needs: [verify, assets, crates, npm, nuget, maven, go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.sha }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: The report (fails if any registry did not succeed)
        env:
          RESULTS: >-
            verify=${{ needs.verify.result }},assets=${{ needs.assets.result }}:${{ needs.assets.outputs.outcome }},crates=${{ needs.crates.result }}:${{ needs.crates.outputs.outcome }},npm=${{ needs.npm.result }}:${{ needs.npm.outputs.outcome }},nuget=${{ needs.nuget.result }}:${{ needs.nuget.outputs.outcome }},maven=${{ needs.maven.result }}:${{ needs.maven.outputs.outcome }},go=${{ needs.go.result }}:${{ needs.go.outputs.outcome }}
        run: bb release-ops summary --tag "$TAG" --results "$RESULTS" ${DRY_FLAG}
