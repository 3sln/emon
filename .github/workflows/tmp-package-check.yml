# TEMPORARY: the `package` job of verify.yml on its own for the two Linux triples (verify-main is held by a run stuck on a retired runner). Deleted right after.
name: tmp-package-check
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: emon
env:
  CI: "true"
jobs:
  package:
    name: package (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 3sln/emon
          ref: main
          path: emon
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - name: Rust 1.92.0 (the version of every gate)
        run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - name: NASM (x86_64 Linux)
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: bb native
        run: bb native --triple ${{ matrix.triple }} --jobs 4
      - name: The pinned pdfium for this platform
        run: bb pdfium-fetch
      - name: bb package
        env:
          EMON_PACKAGE_REQUIRE_NATIVE: "1"
        run: bb package --host c --host pod
      - name: The archives
        run: ls -l dist/c dist/pod
