# D900: changing version.edn on main releases the verified commit end to end.
name: release
on:
  push:
    branches: [main]
    paths: [version.edn]
  workflow_dispatch:
    inputs:
      version:
        description: 'Must equal version.edn at the selected ref (blank reads that file)'
        type: string
        default: ''
      only:
        description: 'Comma list: assets,crates,npm,nuget,maven,go; blank selects all'
        type: string
        default: ''
      dry_run:
        description: 'Verify and build everything selected; publish nothing'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      run: ${{ steps.prepare.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ONLY: ${{ inputs.only }}
          EVENT: ${{ github.event_name }}
        run: bb release-ops prepare --version "$VERSION" --only "$ONLY" --event "$EVENT"
  pipeline:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    uses: ./.github/workflows/release-run.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      only: ${{ inputs.only || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit
    permissions:
      contents: write
      statuses: write
      actions: read
      id-token: write
