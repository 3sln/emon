# The project website on GitHub Pages: built and checked from the verified release commit or a manually selected ref.
# Includes localized landing pages, samples, English documentation, and the browser demo under /demo/.
# Settings > Pages > Source must be "GitHub Actions"; the custom domain remains a repository setting.
name: pages

#   publish.yml (P11.10, D547) CALLS this file (`workflow_call`, `ref` = the verified commit) after it has re-verified the release; it no longer starts on a
#   `release` event of its own, which would deploy before the verification.
on:
  workflow_call:
    inputs:
      ref:
        description: emon ref to publish (branch, tag or sha)
        type: string
        default: main
  workflow_dispatch:
    inputs:
      ref:
        description: emon ref to publish (branch, tag or sha)
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a deployment in progress is finished, not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: emon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref }}
          path: emon
      - uses: actions/checkout@v4
        with:
          repository: 3sln/kin
          path: kin
      - uses: ./emon/.github/actions/setup
      - name: The pinned nightly for the WebAssembly module (the unwinding std)
        run: rustup toolchain install nightly-2026-09-16 -c rust-src -t wasm32-unknown-unknown
      - name: pdfium's WebAssembly build (checksum-verified)
        run: bb pdfium-fetch --platform wasm
      - name: tesseract.js and its model (pinned by the lockfile)
        run: npm ci --prefix host/js
      - name: Website dependencies (pinned by the site lockfile)
        run: npm ci --prefix site
      - name: Build and check the site
        run: bb site --out _site --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: emon/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
