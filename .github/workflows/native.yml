# The native dependency builds of the release artifacts (P11.5, D540; D524): static Tesseract and Leptonica with their codecs, and the pinned
# pdfium, for each of the five CLI targets, one runner each. Native builds work on the host only (nothing is cross-compiled), so this matrix IS how
# the other four targets get built. The pins are tools/native/native.edn (source tarballs, each with a sha256) and tools/pdfium/pdfium.edn.
#   - on demand:  gh workflow run native.yml [-f ref=main]
#   - called from verify.yml (P11.4b, D550) when the plan says the release archives are affected: `uses: ./.github/workflows/native.yml` with `ref` set to the commit; the
#     artifacts native-<triple> carry .cache/native/<triple> (include/, lib/*.a, share/tessdata, manifest.edn, link.rustflags) and the pdfium archive. They and the
#     emon-cli-<triple> artifacts (CLI plus separate experimental PP add-on) are intermediate (7 days): verify.yml collects them into `release-archives`, which is kept 90 days.
# A prefix is cached by the hash of the pins (the file contents of native.edn, giflib.CMakeLists.txt, tesseract-prefind.cmake and native.clj): an unchanged pin is not rebuilt.
# `bb native --audit` runs on every run, cached or built: static libraries only, no jbig2dec, JBIG-KIT, OpenJPEG or GPL symbol, library or link line.
# P11.4b (D541): after the libraries, each job builds the `emon` CLI over them (`bb cli --check`) and uploads emon-cli-<triple> (the archive and its .sha256).
#   verify.yml (D550) calls this file with `ref` set to the verified commit; release.yml attaches the collected archives to the GitHub release.
# K6 (P13.19, D897): the `mobile` job below cross-compiles the same pins for Android (arm64-v8a, armeabi-v7a, x86_64; Ubuntu with the NDK) and iOS (device and simulator;
#   macOS with Xcode), builds libemon over them (`bb mobile`), audits the library (`bb native --audit`: 16 KB ELF alignment, exports = emon.h, no stray dependency), runs the smoke
#   program (iOS simulator: run; Android: linked, and run on an emulator when a runner has one) and uploads emon-c-mobile-<triple> (dist/c/emon-c-<version>-<triple>.tar.gz, named as
#   the desktop C archives are). `mobile: false` leaves it out; verify.yml's call turns it on (K5, D900: the five bundles are release assets, tools/release/ops.clj).
# K8 (P13.21, D901): the `platform` jobs below build the platform OCR adapter libraries and smoke-test them on the platform that has the engine: `vision` (Apple Vision; one macOS runner each for
#   Apple silicon and Intel: `bb vision`, which builds libemon_ocr_vision.dylib and audits it, then a conversion of samples/scan-plain.pdf with `ocr-engine=apple-vision`) and `winocr`
#   (Windows.Media.Ocr; `bb winocr --check`: type-check, build and audit emon_ocr_winocr.dll, then the same conversion with `ocr-engine=windows-media-ocr`). The iOS slices of the Vision adapter
#   are built, audited and (in the simulator) smoke-tested by the `mobile` job. `platform: false` leaves them out; verify.yml's call turns them on (K5, D900). The adapters ship INSIDE the C bundles
#   (lib/emon/adapters/): the macOS bundles are packed by verify.yml's `package` job (which builds the Vision library itself), the iOS ones by `mobile`, and the Windows one by the `native` job below
#   (`bb package --host c` on its Windows runner, which builds emon.dll, the Tesseract adapter and emon_ocr_winocr.dll), uploaded as package-x86_64-pc-windows-msvc beside the others.
# Not triggered by a push or a pull request. The table below is native.edn's :triples (`bb native --check` fails if they differ).
name: native

on:
  workflow_dispatch:
    inputs:
      ref:
        description: emon ref to build (branch, tag or sha)
        type: string
        default: main
      cli:
        description: also build, check and upload the emon CLI archive (bb cli)
        type: boolean
        default: true
      mobile:
        description: also build, audit, smoke-test and upload the Android and iOS libemon archives (bb mobile)
        type: boolean
        default: true
      platform:
        description: also build, audit, smoke-test and upload the Apple Vision and Windows.Media.Ocr adapter libraries (bb vision, bb winocr)
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: emon ref to build (branch, tag or sha)
        type: string
        default: main
      cli:
        description: also build, check and upload the emon CLI archive (bb cli)
        type: boolean
        default: true
      mobile:
        description: also build the mobile (Android, iOS) libemon archives (bb mobile); verify.yml turns it on (K5)
        type: boolean
        default: false
      platform:
        description: also build the platform OCR adapter libraries (Apple Vision, Windows.Media.Ocr); verify.yml turns it on (K5)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: emon

env:
  CI: "true"

jobs:
  native:
    name: native (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin,      runner: macos-15,         pdfium: mac-arm64 }
          - { triple: x86_64-apple-darwin,       runner: macos-15-intel,   pdfium: mac-x64 }
          - { triple: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     pdfium: linux-x64 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, pdfium: linux-arm64 }
          - { triple: x86_64-pc-windows-msvc,    runner: windows-2022,     pdfium: win-x64 }
    steps:
      - name: Preserve byte-pinned source files (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref || 'main' }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.3.190
      # for the CLI steps at the end (P11.4b); the version is the one every gate uses
      - uses: dtolnay/rust-toolchain@master
        if: inputs.cli != false
        with:
          toolchain: 1.92.0
      # NASM: libjpeg-turbo is built with REQUIRE_SIMD=ON, which fails without the assembler on x86_64 (arm64 uses intrinsics)
      - name: NASM (x86_64 macOS)
        if: matrix.triple == 'x86_64-apple-darwin'
        run: brew install nasm
      - name: NASM (x86_64 Linux)
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: NASM (Windows)
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          # the chocolatey feed answers 504 now and then, and a failed native command does not fail this step: retry, then check the file is there
          foreach ($i in 1..4) {
            if (Test-Path "C:\Program Files\NASM\nasm.exe") { break }
            choco install nasm -y --no-progress
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe")) { throw "nasm is not installed" }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: MSVC environment (Windows)
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # the bash steps see Git's usr/bin first, whose `link` is the coreutils one: rustc must be told which link.exe is the linker
      - name: MSVC link.exe for rustc (Windows)
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -like '*MSVC*' } | Select-Object -First 1).Source
          Write-Output "linker: $link"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: The pins are well formed and name this matrix
        run: bb native --check
      - name: Cache key (the pins)
        id: pins
        run: echo "hash=$(bb native --pin-hash)" >> "$GITHUB_OUTPUT"
      - name: Source tarballs (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/dl
          key: native-dl-${{ hashFiles('emon/tools/native/native.edn') }}
      - name: Static Tesseract and Leptonica (by pin hash)
        id: prefix
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/${{ matrix.triple }}
          key: native-prefix-${{ matrix.triple }}-${{ matrix.runner }}-${{ steps.pins.outputs.hash }}
      - name: bb native (a cache hit is only audited)
        run: bb native --triple ${{ matrix.triple }} --jobs 4
      - name: bb native --audit
        run: bb native --triple ${{ matrix.triple }} --audit
      - name: Link a program against the static libraries (unix)
        if: runner.os != 'Windows'
        run: bb native --triple ${{ matrix.triple }} --smoke
      - name: The pinned pdfium for this platform
        run: bb pdfium-fetch --platform ${{ matrix.pdfium }}
      - name: Sizes
        run: |
          du -sh ".cache/native/${{ matrix.triple }}/lib" ".cache/pdfium/chromium-8076/${{ matrix.pdfium }}" || true
          cat ".cache/native/${{ matrix.triple }}/manifest.edn"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.triple }}
          path: |
            emon/.cache/native/${{ matrix.triple }}
            emon/.cache/pdfium/chromium-8076/${{ matrix.pdfium }}
          if-no-files-found: error
          retention-days: 7
      # THE CLI (P11.4b, D541): the same prefix and pdfium, the `emon` binary built over them, packed as emon-<version>-<triple>.tar.gz (.zip on
      # Windows) with its .sha256, then unpacked into a temporary directory and run (`bb cli --check`: `emon version`, only system libraries dynamic,
      # a born-digital and a scanned sample against the committed HTML, the refusals). `cli: false` stops after the native libraries.
      # TODO (D541, D547): macOS code signing and notarisation of bin/emon and lib/libpdfium.dylib. DISABLED: there is no Apple developer identity yet, so the macOS
      # archives ship unsigned (docs/cli.md tells users to clear the quarantine flag). When one exists: import the certificate (secrets APPLE_CERT_P12 and
      # APPLE_CERT_PASSWORD) into a temporary keychain, `codesign --options runtime --timestamp` the binary and the dylib, and `xcrun notarytool submit --wait`
      # (secrets APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD) the zipped result. The signing has to happen where `bb cli` packs the binary, i.e. a hook in tools/cli.clj
      # before the archive is written, so this step cannot simply follow it; then drop `if: false`.
      - name: Sign and notarise the macOS CLI (DISABLED, unsigned for now)
        if: false && runner.os == 'macOS' && inputs.cli != false
        run: echo "TODO signing -- see the comment above"
      - name: bb cli --check (build the archive, unpack it and run it)
        if: inputs.cli != false
        run: bb cli --check --target ${{ matrix.triple }}
      - name: Experimental PP add-on (pinned runtime, adapter, models; unpacked CLI smoke)
        if: inputs.cli != false
        # Keep both separate archives under the same upload root. A second root
        # would nest .cache/cli in the artifact, outside the collector's glob.
        run: bb ppocr-addon --fetch --check --out .cache/cli
      # THE WINDOWS C BUNDLE (K5, D900): emon-c-<version>-x86_64-pc-windows-msvc.tar.gz holds emon.dll (the C ABI of the Dart hook and every FFI consumer), the Tesseract adapter, the
      # Windows.Media.Ocr adapter (`bb winocr` is run by the packager: build and dumpbin audit), the pinned pdfium and the English and OSD packs. The other desktop bundles are packed by verify.yml's
      # `package` job, which cannot build for Windows. Not run anywhere yet: the first release shows whether the Windows build of the packager works (D900).
      - name: "bb package --host c (Windows, the C bundle)"
        if: inputs.cli != false && runner.os == 'Windows'
        env:
          EMON_PACKAGE_REQUIRE_NATIVE: "1"
        run: bb package --host c
      - uses: actions/upload-artifact@v4
        if: inputs.cli != false && runner.os == 'Windows'
        with:
          name: package-${{ matrix.triple }}
          path: emon/dist/c/emon-c-*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: The archive
        if: inputs.cli != false
        run: ls -l .cache/cli/*.tar.gz .cache/cli/*.zip .cache/cli/*.sha256 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: inputs.cli != false
        with:
          name: emon-cli-${{ matrix.triple }}
          path: |
            emon/.cache/cli/emon-*.tar.gz
            emon/.cache/cli/emon-*.zip
            emon/.cache/cli/emon-*.sha256
          if-no-files-found: error
          retention-days: 7

  # THE MOBILE TRIPLES (K6, P13.19, D897): cross-compiled from the same pins, one runner per triple. Android uses NDK r28c (16 KB pages by default; `bb native` refuses an older one),
  # API 24; iOS the Xcode of the runner (iPhoneOS and iPhoneSimulator SDKs), minimum iOS 13.0. The runner's own NDK is not relied on: r28c is installed by name.
  mobile:
    name: mobile (${{ matrix.triple }})
    if: inputs.mobile != false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-linux-android,   runner: ubuntu-24.04, pdfium: android-arm64,        rust: aarch64-linux-android }
          - { triple: armv7-linux-androideabi, runner: ubuntu-24.04, pdfium: android-arm,          rust: armv7-linux-androideabi }
          - { triple: x86_64-linux-android,    runner: ubuntu-24.04, pdfium: android-x64,          rust: x86_64-linux-android }
          - { triple: aarch64-apple-ios,       runner: macos-15,     pdfium: ios-device-arm64,     rust: aarch64-apple-ios }
          - { triple: aarch64-apple-ios-sim,   runner: macos-15,     pdfium: ios-simulator-arm64,  rust: aarch64-apple-ios-sim }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref || 'main' }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.3.190
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.rust }}
      # libjpeg-turbo is built with REQUIRE_SIMD=ON: x86_64 Android needs the assembler (arm64 and armv7 use NEON; iOS arm64 NEON)
      - name: NASM (x86_64 Android)
        if: matrix.triple == 'x86_64-linux-android'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Android NDK r28c
        if: runner.os == 'Linux'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: The pins are well formed and name this matrix
        run: bb native --check
      - name: Cache key (the pins)
        id: pins
        run: echo "hash=$(bb native --pin-hash)" >> "$GITHUB_OUTPUT"
      - name: Source tarballs (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/dl
          key: native-dl-${{ hashFiles('emon/tools/native/native.edn') }}
      - name: Static Tesseract and Leptonica (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/${{ matrix.triple }}
          key: native-prefix-${{ matrix.triple }}-${{ matrix.runner }}-${{ steps.pins.outputs.hash }}
      - name: bb native (cross-compiled; a cache hit is only audited)
        run: bb native --triple ${{ matrix.triple }} --jobs 4
      - name: bb native --audit
        run: bb native --triple ${{ matrix.triple }} --audit
      - name: The pinned pdfium for this platform
        run: bb pdfium-fetch --platform ${{ matrix.pdfium }}
      # libemon + pdfium + models, packed as emon-c-<version>-<triple>.tar.gz; then the library audit and the smoke program (iOS simulator: run in the simulator; Android: linked)
      - name: bb mobile --check (build, audit the library, smoke)
        run: bb mobile --triple ${{ matrix.triple }} --check
      - name: Sizes
        run: ls -l dist/c/emon-c-*.tar.gz && cat ".cache/mobile/${{ matrix.triple }}/manifest.edn"
      - uses: actions/upload-artifact@v4
        with:
          name: emon-c-mobile-${{ matrix.triple }}
          path: emon/dist/c/emon-c-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # APPLE VISION (K8, P13.21, D901): libemon_ocr_vision.dylib for the two macOS architectures, each built on a runner of its own architecture. `bb vision` assembles the crate, compiles the
  # Objective-C shim with the runner's Xcode, links Vision, Foundation, CoreGraphics and ImageIO, and AUDITS the library: one architecture, platform macOS, minos 12.0, system libraries only,
  # exactly one export (emon_ocr_adapter_v1). The smoke converts samples/scan-plain.pdf with `ocr-engine=apple-vision` through the reference driver. A hosted runner is a virtual machine and
  # Apple's text model may not run in it: if the conversion does not, the step says so and does not fail the job (the library was built and audited, which is what this job is for);
  # the maintainer's Mac, and the iOS simulator in the `mobile` job, are where it runs.
  vision:
    name: vision (${{ matrix.triple }})
    if: inputs.platform != false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin, runner: macos-15 }
          - { triple: x86_64-apple-darwin,  runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref || 'main' }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.3.190
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - name: bb vision (build the adapter library and audit it)
        run: bb vision --triple ${{ matrix.triple }}
      - name: Smoke (a scan read with ocr-engine=apple-vision)
        continue-on-error: true
        run: |
          EMON_RS_VISION=1 kin/scripts/emon-rs-build > /dev/null
          .cache/emon-rs-vision/target/release/emon-rs --ocr-engine=apple-vision samples/scan-plain.pdf > "$RUNNER_TEMP/scan-vision.html"
          grep -q "Adaptive Sampling" "$RUNNER_TEMP/scan-vision.html"
          echo "read by Apple Vision: the heading is in the HTML"
      - name: Sizes
        run: ls -l .cache/vision/lib/${{ matrix.triple }}/libemon_ocr_vision.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: emon-ocr-vision-${{ matrix.triple }}
          path: emon/.cache/vision/lib/${{ matrix.triple }}/libemon_ocr_vision.dylib
          if-no-files-found: error
          retention-days: 7

  # WINDOWS.MEDIA.OCR (K8, P13.21, D901): emon_ocr_winocr.dll, Rust over the `windows` crate, built and smoke-tested on a Windows runner (it cannot run anywhere else; off Windows it is only
  # type-checked: `bb winocr --cargo-check`). `bb winocr --check` does four things: type-check the adapter, build the DLL with the C runtime linked statically (/MT), audit it (`dumpbin`:
  # exactly one export, no C or C++ runtime DLL among the imports) and convert samples/scan-plain.pdf with `ocr-engine=windows-media-ocr` through the reference driver
  # (`EMON_RS_WINOCR=1 kin/scripts/emon-rs-build`), requiring the heading in the HTML. Windows.Media.Ocr reads with an installed OCR language pack: the step before adds English's
  # (a Windows capability); a runner without it fails the smoke with a sentence that says so, which is what the smoke is for.
  winocr:
    name: winocr (windows-latest)
    if: inputs.platform != false
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve byte-pinned source files (Windows)
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref || 'main' }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.3.190
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc
      - name: MSVC environment (dumpbin, the linker)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # the bash steps see Git's usr/bin first, whose `link` is the coreutils one: rustc must be told which link.exe is the linker
      - name: MSVC link.exe for rustc
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -like '*MSVC*' } | Select-Object -First 1).Source
          Write-Output "linker: $link"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: English OCR language pack (a Windows capability)
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WindowsCapability -Online -Name "Language.OCR*en-US*" | Format-Table Name, State
          Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
      - name: bb winocr --check (type-check, build, audit, smoke)
        run: bb winocr --check
      - name: Sizes
        run: ls -l .cache/winocr/lib/x86_64-pc-windows-msvc/emon_ocr_winocr.dll
      - uses: actions/upload-artifact@v4
        with:
          name: emon-ocr-winocr-x86_64-pc-windows-msvc
          path: emon/.cache/winocr/lib/x86_64-pc-windows-msvc/emon_ocr_winocr.dll
          if-no-files-found: error
          retention-days: 7
