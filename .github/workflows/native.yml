# The native dependency builds of the release artifacts (P11.5, D540; D524): static Tesseract and Leptonica with their codecs, and the pinned
# pdfium, for each of the five CLI targets, one runner each. Native builds work on the host only (nothing is cross-compiled), so this matrix IS how
# the other four targets get built. The pins are tools/native/native.edn (source tarballs, each with a sha256) and tools/pdfium/pdfium.edn.
#   - on demand:  gh workflow run native.yml [-f ref=main]
#   - called from verify.yml (P11.4b, D550) when the plan says the release archives are affected: `uses: ./.github/workflows/native.yml` with `ref` set to the commit; the
#     artifacts native-<triple> carry .cache/native/<triple> (include/, lib/*.a, share/tessdata, manifest.edn, link.rustflags) and the pdfium archive. They and the
#     emon-cli-<triple> artifacts are intermediate (7 days): verify.yml collects the CLI archives into `release-archives`, which is kept 90 days.
# A prefix is cached by the hash of the pins (the file contents of native.edn, giflib.CMakeLists.txt, tesseract-prefind.cmake and native.clj): an unchanged pin is not rebuilt.
# `bb native --audit` runs on every run, cached or built: static libraries only, no jbig2dec, JBIG-KIT, OpenJPEG or GPL symbol, library or link line.
# P11.4b (D541): after the libraries, each job builds the `emon` CLI over them (`bb cli --check`) and uploads emon-cli-<triple> (the archive and its .sha256).
#   verify.yml (D550) calls this file with `ref` set to the verified commit; publish.yml attaches the collected archives to the GitHub release.
# Not triggered by a push or a pull request. The table below is native.edn's :triples (`bb native --check` fails if they differ).
name: native

on:
  workflow_dispatch:
    inputs:
      ref:
        description: emon ref to build (branch, tag or sha)
        type: string
        default: main
      cli:
        description: also build, check and upload the emon CLI archive (bb cli)
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: emon ref to build (branch, tag or sha)
        type: string
        default: main
      cli:
        description: also build, check and upload the emon CLI archive (bb cli)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: emon

env:
  CI: "true"

jobs:
  native:
    name: native (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin,      runner: macos-14,         pdfium: mac-arm64 }
          - { triple: x86_64-apple-darwin,       runner: macos-15-intel,   pdfium: mac-x64 }
          - { triple: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     pdfium: linux-x64 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, pdfium: linux-arm64 }
          - { triple: x86_64-pc-windows-msvc,    runner: windows-2022,     pdfium: win-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 3sln/emon
          ref: ${{ inputs.ref || 'main' }}
          path: emon
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.3.190
      # for the CLI steps at the end (P11.4b); the version is the one every gate uses
      - uses: dtolnay/rust-toolchain@master
        if: inputs.cli != false
        with:
          toolchain: 1.92.0
      # NASM: libjpeg-turbo is built with REQUIRE_SIMD=ON, which fails without the assembler on x86_64 (arm64 uses intrinsics)
      - name: NASM (x86_64 macOS)
        if: matrix.triple == 'x86_64-apple-darwin'
        run: brew install nasm
      - name: NASM (x86_64 Linux)
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: NASM (Windows)
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: MSVC environment (Windows)
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # the bash steps see Git's usr/bin first, whose `link` is the coreutils one: rustc must be told which link.exe is the linker
      - name: MSVC link.exe for rustc (Windows)
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -like '*MSVC*' } | Select-Object -First 1).Source
          Write-Output "linker: $link"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: The pins are well formed and name this matrix
        run: bb native --check
      - name: Cache key (the pins)
        id: pins
        run: echo "hash=$(bb native --pin-hash)" >> "$GITHUB_OUTPUT"
      - name: Source tarballs (by pin hash)
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/dl
          key: native-dl-${{ hashFiles('emon/tools/native/native.edn') }}
      - name: Static Tesseract and Leptonica (by pin hash)
        id: prefix
        uses: actions/cache@v4
        with:
          path: emon/.cache/native/${{ matrix.triple }}
          key: native-prefix-${{ matrix.triple }}-${{ matrix.runner }}-${{ steps.pins.outputs.hash }}
      - name: bb native (a cache hit is only audited)
        run: bb native --triple ${{ matrix.triple }} --jobs 4
      - name: bb native --audit
        run: bb native --triple ${{ matrix.triple }} --audit
      - name: Link a program against the static libraries (unix)
        if: runner.os != 'Windows'
        run: bb native --triple ${{ matrix.triple }} --smoke
      - name: The pinned pdfium for this platform
        run: bb pdfium-fetch --platform ${{ matrix.pdfium }}
      - name: Sizes
        run: |
          du -sh ".cache/native/${{ matrix.triple }}/lib" ".cache/pdfium/chromium-8076/${{ matrix.pdfium }}" || true
          cat ".cache/native/${{ matrix.triple }}/manifest.edn"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.triple }}
          path: |
            emon/.cache/native/${{ matrix.triple }}
            emon/.cache/pdfium/chromium-8076/${{ matrix.pdfium }}
          if-no-files-found: error
          retention-days: 7
      # THE CLI (P11.4b, D541): the same prefix and pdfium, the `emon` binary built over them, packed as emon-<version>-<triple>.tar.gz (.zip on
      # Windows) with its .sha256, then unpacked into a temporary directory and run (`bb cli --check`: `emon version`, only system libraries dynamic,
      # a born-digital and a scanned sample against the committed HTML, the refusals). `cli: false` stops after the native libraries.
      # TODO (D541, D547): macOS code signing and notarisation of bin/emon and lib/libpdfium.dylib. DISABLED: there is no Apple developer identity yet, so the macOS
      # archives ship unsigned (docs/cli.md tells users to clear the quarantine flag). When one exists: import the certificate (secrets APPLE_CERT_P12 and
      # APPLE_CERT_PASSWORD) into a temporary keychain, `codesign --options runtime --timestamp` the binary and the dylib, and `xcrun notarytool submit --wait`
      # (secrets APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD) the zipped result. The signing has to happen where `bb cli` packs the binary, i.e. a hook in tools/cli.clj
      # before the archive is written, so this step cannot simply follow it; then drop `if: false`.
      - name: Sign and notarise the macOS CLI (DISABLED, unsigned for now)
        if: false && runner.os == 'macOS' && inputs.cli != false
        run: echo "TODO signing -- see the comment above"
      - name: bb cli --check (build the archive, unpack it and run it)
        if: inputs.cli != false
        run: bb cli --check --target ${{ matrix.triple }}
      - name: The archive
        if: inputs.cli != false
        run: ls -l .cache/cli/*.tar.gz .cache/cli/*.zip .cache/cli/*.sha256 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: inputs.cli != false
        with:
          name: emon-cli-${{ matrix.triple }}
          path: |
            emon/.cache/cli/emon-*.tar.gz
            emon/.cache/cli/emon-*.zip
            emon/.cache/cli/emon-*.sha256
          if-no-files-found: error
          retention-days: 7
