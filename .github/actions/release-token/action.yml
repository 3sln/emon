name: release token
description: >-
  The credential that opens the release PR and pushes the release tag (P11.9, D1500). Pushes and pull requests made with the workflow's own GITHUB_TOKEN do NOT start other
  workflows, so the release PR would never get its `pr / verdict` check. Two ways to provide one (docs/releasing.md has the setup of each):
  (1) a GitHub App: pass `app-id` (the repository variable RELEASE_APP_ID) and `private-key` (the secret RELEASE_APP_KEY); a short-lived installation token is made;
  (2) a fine-grained personal access token: pass `pat` (the secret RELEASE_TOKEN). The App wins when both are set.
inputs:
  app-id:
    description: GitHub App id (vars.RELEASE_APP_ID)
    default: ""
  private-key:
    description: GitHub App private key (secrets.RELEASE_APP_KEY)
    default: ""
  pat:
    description: Personal access token (secrets.RELEASE_TOKEN)
    default: ""
outputs:
  token:
    description: The token to use for git push and gh
    value: ${{ steps.pick.outputs.token }}
runs:
  using: composite
  steps:
    - id: app
      if: inputs.app-id != '' && inputs.private-key != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - id: pick
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app.outputs.token }}
        PAT: ${{ inputs.pat }}
      run: |
        token="${APP_TOKEN:-$PAT}"
        if [ -z "$token" ]; then
          echo "::error::no release credential. Create the secret RELEASE_TOKEN (a fine-grained PAT) or the variable RELEASE_APP_ID and the secret RELEASE_APP_KEY (a GitHub App): docs/releasing.md, section 'Credentials'."
          exit 1
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
