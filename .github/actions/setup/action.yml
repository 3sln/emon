name: emon toolchains
description: >-
  Everything the gates use, on ubuntu-latest, at the versions the maintainer's machine runs (D266).
  The workspace holds emon/ and kin/ side by side so `../kin` resolves; this action runs after both are checked out.
  Tesseract and pdfium are deliberately NOT installed: the ocr and render gates replay committed transcripts (D127, D216).
runs:
  using: composite
  steps:
    - uses: DeLaGuardo/setup-clojure@13.4
      with:
        bb: 1.3.190
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
    - uses: actions/setup-go@v5
      with:
        go-version: 1.21.13
        cache: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/go/pkg/mod
          ~/.nuget/packages
          ~/.cache/emon
          emon/.cache/emon
        key: emon-tools-${{ runner.os }}-${{ hashFiles('emon/host/rust/Cargo.lock', 'emon/kin/scripts/unit') }}
        restore-keys: emon-tools-${{ runner.os }}-
    - name: System tools (poppler, ImageMagick 7, python3)
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq poppler-utils python3 python3-pip
        # ImageMagick 7 (`magick`): Ubuntu ships 6, whose CLI has no `magick`. The AppImage runs without FUSE.
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/magick.AppImage" https://github.com/ImageMagick/ImageMagick/releases/download/7.1.1-33/ImageMagick-057259c-gcc-x86_64.AppImage
        chmod +x "$HOME/.local/magick.AppImage"
        printf '#!/bin/sh\nexec "$HOME/.local/magick.AppImage" --appimage-extract-and-run "$@"\n' > "$HOME/.local/bin/magick"
        chmod +x "$HOME/.local/bin/magick"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/magick" -version | head -1
    - name: Python oracles (pinned as on the maintainer's machine)
      shell: bash
      run: |
        # kin/scripts/unit finds these on $EMON_PYLIB or ~/.cache/emon/pylib.
        mkdir -p "$HOME/.cache/emon/pylib"
        python3 -m pip install --quiet --target "$HOME/.cache/emon/pylib" --break-system-packages \
          jsonschema==4.26.0 html5lib==1.1 pdfplumber==0.11.10 pdfminer.six==20260107
    - name: Versions
      shell: bash
      run: |
        bb --version; rustc --version; go version; dotnet --version; java -version 2>&1 | head -1
        pdftotext -v 2>&1 | head -1; python3 --version
        echo "EMON_JDK=$JAVA_HOME" >> "$GITHUB_ENV"
