<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Multilingual Glossary</title>
<style>
@page{size:Letter;margin:1in;}


html{font:11pt/1.45 Georgia, 'Times New Roman', serif;color:#111}
body{margin:0}
h1,h2,h3,h4,h5,h6{margin:1em 0 .4em;line-height:1.2;font-weight:normal;hyphens:none}
p{margin:0 0 .7em;orphans:2;widows:2}
.num{display:inline-block;min-width:3.2em}
table{border-collapse:collapse;font:10pt Helvetica, Arial, sans-serif}
th,td{padding:4px 8px;text-align:left;vertical-align:top}
td.r,th.r{text-align:right}
figure{margin:1em 0}
figcaption{font:italic 9.5pt Helvetica, Arial, sans-serif;margin-top:.3em}

table{width:100%;font-family:'Geeza Pro','Hiragino Sans GB','Devanagari Sangam MN',Helvetica,sans-serif} th,td{border:1px solid #000} h1{font:bold 20pt Helvetica, Arial, sans-serif}
</style>

</head>
<body>
<h1>Multilingual Glossary</h1><p>One table, four scripts, each row a translation of the same term.</p><table data-profile="ruled"><thead><tr><th>English</th><th lang="ar" dir="rtl">العربية</th><th lang="zh">中文</th><th lang="hi">हिन्दी</th></tr></thead><tbody><tr><td>Report</td><td lang="ar" dir="rtl">تقرير</td><td lang="zh">报告</td><td lang="hi">रिपोर्ट</td></tr><tr><td>Budget</td><td lang="ar" dir="rtl">ميزانية</td><td lang="zh">预算</td><td lang="hi">बजट</td></tr><tr><td>Customer</td><td lang="ar" dir="rtl">عميل</td><td lang="zh">客户</td><td lang="hi">ग्राहक</td></tr><tr><td>Quality</td><td lang="ar" dir="rtl">جودة</td><td lang="zh">质量</td><td lang="hi">गुणवत्ता</td></tr></tbody></table>
</body>
</html>
