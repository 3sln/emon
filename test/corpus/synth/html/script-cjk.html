<h1>年度报告</h1><p>本公司五十年前在沿海的一座小城市开始经营，随后逐步发展，成为本地区最大的机构之一。</p><h2>概述</h2><p>新的计划侧重于改善服务、降低成本，并在未来几年内提高所有分支机构的客户满意度。</p><h2>目标</h2><ol><li>提高服务质量</li><li>降低运营成本</li><li>扩大客户基础</li></ol><h1>年次報告書</h1><p>当社は五十年前に海沿いの小さな町で事業を始め、徐々に拡大して地域最大級の組織の一つとなりました。</p><h2>概要</h2><p>新しい計画は、サービスの向上とコストの削減、そして全支店の顧客満足度の向上に重点を置いています。</p><table data-profile="ruled"><thead><tr><th>部門</th><th>人数</th><th>成長率</th></tr></thead><tbody><tr><td>営業</td><td>120</td><td>5%</td></tr><tr><td>サポート</td><td>85</td><td>8%</td></tr></tbody></table>
