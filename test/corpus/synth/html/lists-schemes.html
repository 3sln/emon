<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Reference Lists</title>
<style>
@page{size:Letter;margin:1in;}


html{font:11pt/1.45 Georgia, 'Times New Roman', serif;color:#111}
body{margin:0}
h1,h2,h3,h4,h5,h6{margin:1em 0 .4em;line-height:1.2;font-weight:normal;hyphens:none}
p{margin:0 0 .7em;orphans:2;widows:2}
.num{display:inline-block;min-width:3.2em}
table{border-collapse:collapse;font:10pt Helvetica, Arial, sans-serif}
th,td{padding:4px 8px;text-align:left;vertical-align:top}
td.r,th.r{text-align:right}
figure{margin:1em 0}
figcaption{font:italic 9.5pt Helvetica, Arial, sans-serif;margin-top:.3em}

ol,ul{margin:0 0 .8em;padding-left:2em}
</style>

</head>
<body>
<h1>Reference Lists</h1><h2>Alphabetic</h2><ol type="a"><li>Apples</li><li>Bananas</li><li>Cherries</li></ol><h2>Roman</h2><ol type="I"><li>Preamble</li><li>Definitions</li><li>Obligations</li><li>Term</li></ol><h2>Resumed</h2><ol start="5"><li>Fifth item with a <a href="https://example.org/five">link</a>.</li><li>Sixth item, <i>emphasised</i> and <code>monospaced</code>.</li><li>Seventh item</li></ol><h2>Explicit values</h2><ol><li value="3">Third</li><li>Fourth</li><li value="10">Tenth</li></ol>
</body>
</html>
