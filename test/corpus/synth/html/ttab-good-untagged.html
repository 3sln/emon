<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Tagged table</title>
<style>
@page{size:Letter;margin:1in;}


html{font:11pt/1.45 Georgia, 'Times New Roman', serif;color:#111}
body{margin:0}
h1,h2,h3,h4,h5,h6{margin:1em 0 .4em;line-height:1.2;font-weight:normal;hyphens:none}
p{margin:0 0 .7em;orphans:2;widows:2}
.num{display:inline-block;min-width:3.2em}
table{border-collapse:collapse;font:10pt Helvetica, Arial, sans-serif}
th,td{padding:4px 8px;text-align:left;vertical-align:top}
td.r,th.r{text-align:right}
figure{margin:1em 0}
figcaption{font:italic 9.5pt Helvetica, Arial, sans-serif;margin-top:.3em}

table{width:100%}
</style>

</head>
<body>
<h1>Supplies Ledger</h1><p>The table below was extracted from the supplies ledger. Figures are totals for the quarter.</p><table data-profile="ruled"><thead><tr><th>Region</th><th colspan="2">Sales</th><th>Notes</th></tr></thead><tbody><tr><td rowspan="2">North</td><td>120</td><td>135</td><td>up</td></tr><tr><td>98</td><td>104</td><td>flat</td></tr><tr><td>South</td><td>75</td><td>80</td><td>up</td></tr></tbody></table><p>Questions go to the purchasing office.</p>
</body>
</html>
