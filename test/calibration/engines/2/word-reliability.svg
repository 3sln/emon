<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" font-family="sans-serif" font-size="11">
<title>PP word calibration, weighted isotonic D845 fit</title>
<rect width="100%" height="100%" fill="#fff"/>
<text x="10" y="22" font-size="14" font-weight="bold">PP word calibration, weighted isotonic D845 fit</text>
<g>
<rect x="34" y="64" width="152" height="152" fill="none" stroke="#999"/>
<line x1="34" y1="216.0" x2="186" y2="64.0" stroke="#bbb" stroke-dasharray="4 3"/>
