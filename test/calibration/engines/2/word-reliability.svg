<circle cx="61.2" cy="182.2" r="2.9" fill="#1f6feb" fill-opacity="0.55"/>
<circle cx="98.1" cy="147.6" r="3.6" fill="#1f6feb" fill-opacity="0.55"/>
<circle cx="113.2" cy="136.9" r="3.9" fill="#1f6feb" fill-opacity="0.55"/>
<circle cx="168.2" cy="82.1" r="8.2" fill="#1f6feb" fill-opacity="0.55"/>
<text x="34" y="52" font-weight="bold">word  n=8230</text>
<text x="34" y="230">ECE 0.003  Brier 0.117</text>
<text x="34" y="242" fill="#666">confidence (x) vs accuracy (y)</text>
</g>
<g>
<rect x="254" y="64" width="152" height="152" fill="none" stroke="#999"/>
